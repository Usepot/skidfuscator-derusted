exempt=[
    "class{^jghost\\/}",
    "class{Dump}",
    "class{^org\\/jnativehook\\/}",
    "class{^com\\/sun\\/jna\\/}"
]
flowCondition {
    enabled=true
}
flowException {
    enabled=true
    strength=AGGRESSIVE
}
